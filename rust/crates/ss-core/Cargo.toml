[package]
name = "ss-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "UniFFI facade: CoreEngine lifecycle and version API."

[lints]
workspace = true

[features]
default = []
avif = []
ffmpeg = []
av1sw = []
mp3 = []
iap = []
opus-encode = ["ss-audio/opus-encode"]

[lib]
name = "ss_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
ss-domain.workspace = true
ss-jobs.workspace = true
ss-sqlite.workspace = true
ss-image.workspace = true
ss-audio.workspace = true
ss-probe.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true
uuid.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
