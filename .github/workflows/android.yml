name: Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.0.13004108"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Build Android Rust core with opus-encode
        working-directory: rust
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo ndk -t arm64-v8a -t x86_64 build --release -p ss-core --features opus-encode

      - name: Automated quality gate
        shell: pwsh
        working-directory: packaging
        run: ./run-quality-gate.ps1
