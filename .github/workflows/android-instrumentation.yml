# Lab job: instrumentation smoke on emulator (not required for PR merge).
# Full video HW / JPEG batch smoke remains manual per docs/smoke-checklist.md.

name: Android Instrumentation (Lab)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  instrumented-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;28.0.13004108"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Build Android Rust core with opus-encode
        working-directory: rust
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo ndk -t arm64-v8a -t x86_64 build --release -p ss-core --features opus-encode

      - name: Instrumentation smoke (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            cd android
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
